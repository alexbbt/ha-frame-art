<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frame Art</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <p class="kicker">Samsung Frame</p>
      <h1>Albums</h1>
      <p class="sub">The TV keeps every photo in one pile. It can rotate all of them, or only Favorites. Folders live here. Play a folder to make that the set on the TV.</p>
    </header>

    <div id="albums" class="albums"></div>
    <form id="new-album" class="new-album">
      <input id="album-name" type="text" maxlength="40" placeholder="New folder" />
      <button type="submit">Add</button>
    </form>

    <div class="actions">
      <button id="play" type="button">Play this folder</button>
      <button id="play-all" type="button" class="secondary">Play every photo</button>
      <button id="rename" type="button" class="secondary">Rename</button>
      <button id="delete-folder" type="button" class="secondary">Delete folder</button>
      <button id="sync" type="button" class="secondary">Refresh from the TV</button>
    </div>
    <p id="message" class="message" hidden></p>

    <form id="drop" class="drop">
      <input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple />
      <p class="drop-title">Add pictures</p>
      <p class="drop-hint">JPEG, PNG, WebP, or an iPhone photo</p>
    </form>

    <section>
      <h2 id="folder-title">Pictures</h2>
      <ul id="photos" class="list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
