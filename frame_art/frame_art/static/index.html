<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>
    try {
      var savedTheme = localStorage.getItem("frame-art-theme");
      if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    } catch (err) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Frame Art</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">Photos</h1>
      <p id="status" class="status">Loading</p>
      <div class="appearance" role="group" aria-label="Appearance">
        <button type="button" data-theme="auto" aria-pressed="true">Auto</button>
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
      </div>
    </header>

    <div class="albums-row">
      <nav id="albums" class="albums" aria-label="Albums"></nav>
      <button id="new-folder" type="button" class="icon" aria-label="New folder">+</button>
    </div>

    <label id="drop" class="add">
      <input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple />
      <span id="add-label">Add photos</span>
    </label>
    <p id="message" class="message" hidden></p>

    <section id="grid" class="grid" aria-label="Photos"></section>

    <section class="settings">
      <h2>On the TV</h2>
      <form id="controls">
        <label>
          <span>Each picture</span>
          <select id="minutes"></select>
        </label>
        <label>
          <span>Order</span>
          <select id="order">
            <option value="shuffle">Shuffle</option>
            <option value="order">In order</option>
          </select>
        </label>
        <label>
          <span>Rotate</span>
          <select id="rotate">
            <option value="">Off</option>
            <option value="folder">This folder</option>
            <option value="all">Every photo</option>
          </select>
        </label>
        <label id="row-brightness">
          <span>Brightness</span>
          <input id="brightness" type="range" min="0" max="10" step="1" />
        </label>
        <label id="row-color">
          <span>Color</span>
          <input id="color" type="range" min="0" max="50" step="1" />
        </label>
        <label id="row-motion">
          <span>Motion</span>
          <select id="motion">
            <option value="1">Low</option>
            <option value="2">Medium</option>
            <option value="3">High</option>
          </select>
        </label>
        <label id="row-sensor">
          <span>Light sensor</span>
          <select id="sensor">
            <option value="on">On</option>
            <option value="off">Off</option>
          </select>
        </label>
        <label id="row-sleep">
          <span>Art stays on</span>
          <select id="sleep">
            <option value="off">Until turned off</option>
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="120">2 hours</option>
            <option value="240">4 hours</option>
          </select>
        </label>
      </form>
      <button id="delete-folder" type="button" class="quiet" hidden>Delete this folder</button>
    </section>
  </div>

  <dialog id="sheet">
    <form method="dialog">
      <img id="sheet-image" alt="" />
      <div class="sheet-body">
        <p id="sheet-name"></p>
        <label>
          <span>Move to</span>
          <select id="sheet-move"></select>
        </label>
        <button id="sheet-remove" type="button" class="danger">Remove from the TV</button>
        <button type="submit" class="quiet">Close</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
